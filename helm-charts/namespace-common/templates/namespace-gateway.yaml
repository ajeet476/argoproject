{{- if and .Values.namespace.create .Values.namespace.gateway.create -}}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.namespace.name }}-gateway
  namespace: {{ .Values.namespace.name }}
spec:
{{- with .Values.namespace.gateway -}}
{{- if .use_gateway_api }}
  gatewayClassName: {{ .type }}
  listeners:
    - name: http
      hostname: {{ .hostname | quote }}
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
{{- else }}
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: HTTP
        protocol: HTTP
      hosts:
        - {{ .hostname | quote }}
{{- end }}
{{- end }}
{{- end }}
