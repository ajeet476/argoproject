# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appGenerators:
  - enabled: true
    name: spark
    server: https://kubernetes.default.svc
    namespace: production
    sources:
      - repoURL: oci://registry-1.docker.io/bitnamicharts/spark
        targetRevision: HEAD
        helm:
          valueFiles:
            - $values/applications/{{ .name }}/app_global.yaml
      - repoURL: https://github.com/ajeet476/argoproject.git
        targetRevision: HEAD
        ref: values

listGenerators:
  - enabled: true
    name: prod-apps
    server: https://kubernetes.default.svc
    repoURL: https://github.com/ajeet476/argoproject.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - applications/{{ .name }}/app_global.yaml
    namespace: production
    apps:
      - name: cpn-api
        path: helm-charts/app
      - name: use-api
        path: helm-charts/app
  - enabled: true
    name: namespaces
    server: https://kubernetes.default.svc
    repoURL: https://github.com/ajeet476/argoproject.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - applications/namespace/{{ .name }}.yaml
    apps:
      - name: dev
        path: helm-charts/namespace-common
      - name: stg
        path: helm-charts/namespace-common
      - name: prod
        path: helm-charts/namespace-common

matrixGenerators:
  - enabled: true
    name: dev-apps
    repoURL: https://github.com/ajeet476/argoproject.git
    helm:
      valueFiles:
        - applications/{{ .name }}/app_global.yaml
    targetRevision: HEAD
    server: https://kubernetes.default.svc
    namespaces:
      - dev
      - stg
    apps:
      - name: cpn-api
        path: helm-charts/app
      - name: use-api
        path: helm-charts/app
      - name: use-batch
        path: helm-charts/app
      - name: use-report
        path: helm-charts/app
      - name: demo-app
        path: helm-charts/app

gitRepoCred:
  enabled: true
  url: https://github.com/ajeet476
  username: ""
  password: ""

gitRepos:
  - enabled: true
    name: "argoproject"
    url: https://github.com/ajeet476/argoproject
