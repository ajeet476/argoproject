{{- $template := .Files.Get "files/matrix_template.yaml" | fromYaml -}}
{{- range $appset := .Values.matrixGenerators }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $appset.name }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/targetRevision
  generators:
    - matrix:
        generators:
          - list:
              elements:
              {{- range $ns := $appset.namespaces }}
                - namespace: {{ $ns }}
              {{- end }}
          - list:
              elements:
                {{- $appset.apps | toYaml | nindent 16 }}
  template:
  {{- $appSpec := include "argo-app.template.spec" (dict "ArgoApp" $appset) | fromYaml }}
  {{- merge (dict "spec" $appSpec) $template | toYaml | nindent 4 }}
{{- end }}
