{{- $template := (.Files.Get "files/list_template.yaml") | fromYaml }}
{{- range $appset := .Values.appGenerators }}
{{- if $appset.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $appset.name }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/targetRevision
  generators:
    - clusters:
  template:
{{- end }}
{{- end }}
