{{- if and .Values.istio.create .Values.istio.gateway.create }}
{{- $service := (include "app.fullname" . | trim) -}}
{{- with .Values.istio.gateway }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ $service }}
spec:
  hosts:
    {{- .hosts | toYaml | nindent 4 }}
  gateways:
    {{- .gateways | toYaml | nindent 4 }}
  http:
    {{- range .routes }}
    - match:
        - uri:
            {{ .type }}: {{ .path }}
    {{- if .rewrite }}
      rewrite:
        uri: {{ .rewrite }}
    {{- end }}
      route:
    {{- include "app.istio.route.destination" (dict "RouteDest" (dict "host" $service)) | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
