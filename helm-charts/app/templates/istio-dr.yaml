{{- if and .Values.istio.create .Values.istio.destinationRule.create }}
{{- $service := (include "app.fullname" . | trim) -}}
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: {{ $service }}
spec:
  host: {{ $service }}
  subsets:
    - name: canary
    - name: stable
{{- end }}
