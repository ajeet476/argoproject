{{- if eq "Job" .Values.appType -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- with .Values.batch }}
  suspend: {{ default "false" .suspend }}
  backoffLimit: {{ default 4 .backoffLimit }}
  activeDeadlineSeconds: {{ default 100 .activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ default 100 .ttlSecondsAfterFinished }}
  {{- end }}
  template:
    restartPolicy: Never
    metadata:
    {{- include "app.pod.metadata" . | nindent 6 }}
    spec:
    {{- include "app.pod.spec" . | nindent 6 }}
{{- end }}
