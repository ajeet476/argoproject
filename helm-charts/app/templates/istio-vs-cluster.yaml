{{- if and .Values.istio.create .Values.istio.cluster.create }}
{{- $service := (include "app.fullname" . | trim) -}}
{{- $service_port := .Values.service.port -}}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ $service }}-cluster
spec:
  hosts:
    - {{ $service }}
  http:
    - route:
      - destination:
          host: {{ $service }}
          port:
            number: {{ $service_port }}
{{- end }}
